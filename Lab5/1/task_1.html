<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 1 - Вариант 10</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f7f6; }
        .result { background: #fff; padding: 15px; margin: 10px 0; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .success { color: #27ae60; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>
    <h1>Задание 1. Разрезание прямоугольника на квадраты</h1>
    
    <div id="output"></div>

    <script>
        function countCuts(n, m) {
            let count = 0;
            let a = n;
            let b = m;
            while (a !== b) {
                if (a > b) {
                    a -= b;
                } else {
                    b -= a;
                }
                count++;
            }
            return count;
        }

        let N = parseInt(prompt("Введите длину прямоугольника (N):", "10"));
        let M = parseInt(prompt("Введите ширину прямоугольника (M):", "6"));

        const output = document.getElementById('output');

        if (isNaN(N) || isNaN(M) || N <= 0 || M <= 0) {
            output.innerHTML = `<div class="result" style="color:red;">Ошибка: введите корректные положительные числа!</div>`;
            console.log("Ошибка ввода.");
        } else {
            let result = countCuts(N, M);
            
            console.log(`Прямоугольник ${N}x${M}. Количество отрезаний: ${result}`);

            const div = document.createElement('div');
            div.className = 'result';
            div.innerHTML = `Для прямоугольника <b>${N}x${M}</b> нужно сделать отрезаний: <span class="success">${result}</span>`;
            output.appendChild(div);
        }
    </script>
</body>
</html>
