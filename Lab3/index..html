<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка на ремонт ноутбука</title>
    <link rel="stylesheet" href="style..css">
</head>
<body>

    <div class="form-container">
        <h2>Заявка на ремонт ноутбука</h2>

        <form action="#" method="POST">

            <div class="form-group">
                <label for="name">Ваше имя</label>
                <input type="text" id="name" name="name" placeholder="Введите имя" required>
            </div>

            <div class="form-group">
                <label for="phone">Телефон</label>
                <input type="tel" id="phone" name="phone" placeholder="+7 (999) 999-99-99" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="example@mail.ru" required>
            </div>

            <div class="form-group">
                <label for="brand">Марка ноутбука</label>
                <select id="brand" name="brand" required>
                    <option value="">Выберите марку...</option>
                    <option value="asus">ASUS</option>
                    <option value="acer">Acer</option>
                    <option value="lenovo">Lenovo</option>
                    <option value="hp">HP</option>
                    <option value="apple">Apple</option>
                    <option value="other">Другая</option>
                </select>
            </div>

            <div class="form-group">
                <label for="model">Модель ноутбука</label>
                <input type="text" id="model" name="model" placeholder="Например, IdeaPad 3" required>
            </div>

            <div class="form-group">
                <label for="problem">Описание неисправности</label>
                <textarea id="problem" name="problem" rows="4" placeholder="Опишите, что случилось с ноутбуком..." required></textarea>
            </div>

            <div class="form-group radio-group">
                <span class="label-text">Срочность ремонта</span>
                <div class="radio-options">
                    <label>
                        <input type="radio" name="urgency" value="standard" checked> Стандартный (3-5 дней)
                    </label>
                    <label>
                        <input type="radio" name="urgency" value="urgent"> Срочный (1 день)
                    </label>
                </div>
            </div>

            <div class="form-group checkbox-group">
                <label>
                    <input type="checkbox" name="agreement" required>
                    Я согласен на обработку персональных данных
                </label>
            </div>

            <button type="submit" class="submit-btn">Отправить заявку</button>

        </form>
    </div>

</body>
</html>
</html>
